<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Star Game</title>
<style>
:root{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
--bg:#fff7d6;--bg2:#ffd9f0;--fg:#2b1b4d;--card:#fff;--bf:#2b1b4d;--b1:#ff6b6b;--b2:#ffd23f;--b3:#3ddc97;--b4:#4dabf7;--good:#3ddc97;--bad:#ff9a9a;--accent:#7b4dff;--ok:#12803f;--no:#c0392b;--star:#f59f00}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1b1238;--bg2:#3a1450;--fg:#fff4d6;--card:#2a1f52;--bf:#fff;--b1:#c93b3b;--b2:#a67c00;--b3:#1a8a5b;--b4:#2a72b8;--good:#1a8a5b;--bad:#8b2f3a;--accent:#b79bff;--ok:#6fe08a;--no:#ff8a80;--star:#ffd54a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b1238;--bg2:#3a1450;--fg:#fff4d6;--card:#2a1f52;--bf:#fff;--b1:#c93b3b;--b2:#a67c00;--b3:#1a8a5b;--b4:#2a72b8;--good:#1a8a5b;--bad:#8b2f3a;--accent:#b79bff;--ok:#6fe08a;--no:#ff8a80;--star:#ffd54a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:600px;margin:0 auto;padding:16px}
[hidden]{display:none!important}
h1{text-align:center;font-size:2.2rem;margin:.5em 0 .2em;background:linear-gradient(90deg,#ff6b6b,#ff9f1c,#3ddc97,#4dabf7,#a98bff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) scale(1.03)}}
.c{text-align:center}
label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:1.2rem;margin:14px 0;font-weight:600}
input,select{font:inherit;padding:8px;width:62%;border-radius:12px;border:3px solid var(--accent);background:var(--card);color:var(--fg)}
select{font-size:1rem}button{font:inherit;cursor:pointer;border:0;border-radius:16px;color:var(--bf)}
.big{display:block;margin:22px auto;padding:14px 44px;font-size:1.8rem;font-weight:800;background:linear-gradient(180deg,#ffd23f,#ff9f1c);color:#2b1b4d;border-bottom:5px solid rgba(0,0,0,.25)}
.big:active,.opt:active{transform:translateY(3px)}
.top{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:700}
#q{font-size:clamp(1.8rem,8.5vw,3.2rem);font-weight:900;text-align:center;margin:8px 0}
canvas{width:100%;height:auto;display:block;border-radius:12px;border:3px solid #33ff33;background:#000}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.opt{min-height:72px;font-size:clamp(1.5rem,6vw,2.2rem);font-weight:800;color:var(--bf);border-bottom:5px solid rgba(0,0,0,.25)}
.opt:nth-child(1){background:var(--b1)}.opt:nth-child(2){background:var(--b2)}.opt:nth-child(3){background:var(--b3)}.opt:nth-child(4){background:var(--b4)}
.opt.good{background:var(--good);animation:pop .45s}.opt.bad{background:var(--bad)}
@keyframes pop{50%{transform:scale(1.12) rotate(-2deg)}}
.opt:disabled{opacity:.75;cursor:default}
#fb{min-height:2em;text-align:center;font-size:1.4rem;font-weight:800}
.ok{color:var(--ok)}.no{color:var(--no)}
.small{padding:6px 16px;background:var(--card);border:2px solid var(--accent)}
#stars{text-align:center;font-size:3rem;color:var(--star)}
.card{background:var(--card);border-radius:18px;padding:10px 18px;margin:16px 0;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.card h2{margin:.2em 0 .4em;text-align:center;font-size:1.3rem}
ol{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;padding:4px 0;font-size:1.15rem}
li.me{font-weight:800;color:var(--accent)}
.sp{position:fixed;z-index:9;pointer-events:none;font-size:1.7rem;margin:-.8rem 0 0 -.8rem;animation:fly .95s ease-out forwards}
.sp.pts{font-size:2.3rem;font-weight:900;color:var(--star);text-shadow:0 2px 0 rgba(0,0,0,.35)}
@keyframes fly{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--r));opacity:0}}
@media(prefers-reduced-motion:reduce){.sp,h1,.opt.good{animation:none}.sp{display:none}}
</style>
</head>
<body>
<main>
<div style="text-align:right"><button class="small" id="mute">🔊 Sound on</button></div>
<section id="start">
  <h1>⭐ Math Star Game ⭐</h1>
  <p class="c">Practice your math and win stars!</p>
  <label>Your name <input id="name" maxlength="20" autocomplete="off"></label>
  <label>Practice <select id="mode"><option value="1">Addition (+)</option><option value="2">Subtraction (−)</option><option value="7">Addition and subtraction (+ −)</option><option value="3">Multiplication (×)</option><option value="4">Division (÷)</option><option value="5">Fractions: same denominator (+ −)</option><option value="8">Fractions: different denominators (+ −)</option><option value="9">Fractions: multiply and divide (× ÷)</option><option value="6">Surprise mix of all</option></select></label>
  <label>Number table <select id="tbl"></select></label>
  <button class="big" id="go">START!</button>
  <div class="card"><h2>🏆 Top Scores</h2><ol id="bd"></ol></div>
</section>

<section id="game" hidden>
  <div class="top"><span id="prog"></span><span id="sc"></span></div>
  <div id="q"></div>
  <canvas id="cv" width="660" height="132" aria-label="Arcade board where the Muncher eats the answer"></canvas>
  <div id="opts"></div>
  <div id="fb"></div>
  <button class="small" id="menu">Menu</button>
</section>

<section id="end" hidden>
  <h1 id="done"></h1>
  <p class="c" id="res" style="font-size:1.8rem;font-weight:800;margin:.2em"></p>
  <p class="c" id="tm" style="font-size:1.2rem;margin:.2em"></p>
  <div id="stars"></div>
  <p class="c" id="msg" style="font-size:1.3rem;font-weight:700"></p>
  <div class="card"><h2>🏆 Top Scores</h2><ol id="bd2"></ol></div>
  <button class="big" id="again">Play Again</button>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const S=60,G='#33ff33',NQ=10,MAXT=2;
const TX=[-.49,-.49,-.28,.28,.49,.49,.245,0,-.245],TY=[-.49,.35,.56,.56,.35,-.49,-.28,-.49,-.28];
const CX=[2.75,4.75,6.75,8.75],HX=.8,LY=.5,HY=1.45,R=.5;
const PR=['Great job!','Awesome!','You got it!','Super!','Fantastic!','Way to go!','Brilliant!'];
const cv=$('cv'),c=cv.getContext('2d');
let gen=0,mode=1,tbl=0,name='Friend',q=0,pts=0,think=0,t0=0,tries=0,ans=0,ch=[0,0,0,0],locked=true;
let mx=-.6,my=LY,face=0,mouth=.3,ph=0,mcol=G,trog=null,cells=[];

// ---------- sound (synthesized, no files) ----------
let AC=null,mute=false;
try{mute=localStorage.getItem('msg-mute')==='1'}catch(e){}
function tone(f,d,type='square',v=.1,at=0,f2){
  if(mute)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime+at;
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
const snd={
  click:()=>tone(660,.06),
  chomp:()=>{tone(520,.07,'square',.1,0,260);tone(260,.07,'square',.1,.09,520)},
  yum:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.14,'square',.1,i*.07)),
  growl:()=>tone(120,.4,'sawtooth',.12,0,70),
  oops:()=>{tone(330,.18,'sawtooth',.12,0,200);tone(250,.18,'sawtooth',.12,.2,150);tone(180,.3,'sawtooth',.12,.4,90)},
  fin:good=>(good?[523,659,784,1047,784,1047]:[392,440,494,523]).forEach((f,i)=>tone(f,.2,'square',.1,i*.15))
};
const setMute=()=>{$('mute').textContent=mute?'🔇 Sound off':'🔊 Sound on'};
$('mute').onclick=()=>{mute=!mute;try{localStorage.setItem('msg-mute',mute?'1':'0')}catch(e){}setMute();snd.click()};
setMute();

// ---------- scoreboard (saved in this browser) ----------
const load=()=>{try{return JSON.parse(localStorage.getItem('msg-board'))||[]}catch(e){return[]}};
function save(n,s){
  const L=load(),i=L.findIndex(e=>e.n.toLowerCase()===n.toLowerCase());let nb=true;
  if(i<0)L.push({n,s});else if(s>L[i].s)L[i]={n,s};else nb=false;
  L.sort((a,b)=>b.s-a.s);
  try{localStorage.setItem('msg-board',JSON.stringify(L.slice(0,10)))}catch(e){}
  return nb;
}
function board(ol,me){
  const L=load();ol.textContent='';
  if(!L.length){const li=document.createElement('li');li.textContent='No scores yet. Be the first!';ol.appendChild(li)}
  L.forEach((e,i)=>{
    const li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('span');
    a.textContent=(['🥇','🥈','🥉'][i]||(i+1)+'.')+' '+e.n;b.textContent=e.s;
    li.append(a,b);if(me&&e.n.toLowerCase()===me.toLowerCase())li.className='me';ol.appendChild(li);
  });
}

// ---------- sparkles ----------
function sp(x,y,t,dx,dy,cl=''){
  const s=document.createElement('span');s.className='sp '+cl;s.textContent=t;
  s.style.cssText=`left:${x}px;top:${y}px;--dx:${dx}px;--dy:${dy}px;--r:${Math.random()*360-180}deg`;
  document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
}
function burst(el,p){
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,E=['✨','⭐','🌟','💫','🎉','💖'];
  for(let i=0;i<20;i++)sp(cx,cy,E[i%6],(Math.random()-.5)*380,(Math.random()-.9)*280);
  sp(cx,cy,'+'+p,0,-130,'pts');
}

// ---------- setup ----------
$('tbl').innerHTML='<option value="0">All numbers</option>'+Array.from({length:12},(_,i)=>`<option>${i+1}</option>`).join('');
for(let k=0;k<4;k++){const b=document.createElement('button');b.className='opt';b.onclick=()=>pick(k);$('opts').appendChild(b)}
const show=id=>{['start','game','end'].forEach(s=>$(s).hidden=s!==id);if(id==='start')board($('bd'))};
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=n=>1+Math.random()*n|0;
const choices=(a,ex=[],mx=1e9)=>sh([a,...sh([...new Set([-3,-2,-1,1,2,3,10,-10,...ex].map(d=>a+d))].filter(v=>v>=0&&v!==a&&v<=mx)).slice(0,3)]);

const gcd=(a,b)=>b?gcd(b,a%b):a;
const fr=(n,d)=>{const g=gcd(n,d)||1;return d/g==1?`${n/g}`:`${n/g}/${d/g}`};   // reduced fraction as text
function fch(n,d){                   // answer in lowest terms + 3 wrong fractions of different value
  const g=gcd(n,d),N=n/g,D=d/g,a=fr(N,D),seen=new Set([a]),out=[];
  sh([[N+1,D],[N-1,D],[N,D+1],[N,D-1],[N+2,D],[N+1,D+1],[N-1,D-1],[N+3,D],[N,D+2],[N+1,D-1],[N-1,D+1],[D,N]]).forEach(([p,r])=>{
    if(p<0||r<1||out.length>2||p*D===N*r)return;
    const s=fr(p,r);if(seen.has(s))return;seen.add(s);out.push(s)});
  return[a,sh([a,...out])];
}
function fDiff(){                   // different denominators; answer never above 1, never negative
  const L=[2,3,4,5,6,8,10,12],add=Math.random()<.5;let d1,d2,n1,n2;
  do{d1=tbl>1?tbl:L[Math.random()*8|0];d2=L[Math.random()*8|0];n1=rnd(d1-1);n2=rnd(d2-1)}
  while(d1==d2||(add?n1*d2+n2*d1>d1*d2:n1*d2<=n2*d1));
  return[`${n1}/${d1} ${add?'+':'−'} ${n2}/${d2} = ?`,...fch(add?n1*d2+n2*d1:n1*d2-n2*d1,d1*d2)];
}
function fMD(){                     // fraction x fraction, or the product divided back by one of them
  const d1=2+Math.random()*5|0,d2=2+Math.random()*5|0,n1=rnd(d1-1),n2=rnd(d2-1);
  if(Math.random()<.5)return[`${fr(n1,d1)} × ${fr(n2,d2)} = ?`,...fch(n1*n2,d1*d2)];
  return[`${fr(n1*n2,d1*d2)} ÷ ${fr(n2,d2)} = ?`,...fch(n1,d1)];
}
function mk(){                       // returns [question text, answer, 4 choices]
  const x=tbl||rnd(12),y=rnd(12),op=mode==6?[1,2,3,4,5,8,9][Math.random()*7|0]:mode==7?rnd(2):mode;let a=x,b=y;
  if(op==1||op==3){if(Math.random()<.5)[a,b]=[b,a]}
  if(op==1)return[`${a} + ${b} = ?`,a+b,choices(a+b)];
  if(op==2)return[`${x+y} − ${x} = ?`,y,choices(y)];            // never negative
  if(op==3)return[`${a} × ${b} = ?`,a*b,choices(a*b,[x,-x,y,-y])];
  if(op==4)return[`${x*y} ÷ ${x} = ?`,y,choices(y)];            // always a whole number
  if(op==8)return fDiff();if(op==9)return fMD();const d=tbl>1?tbl:1+rnd(11);                                    // fractions with the same bottom number
  if(Math.random()<.5){const n=rnd(d-1),m=rnd(d-n);return[`${n}/${d} + ${m}/${d} = ?`,...fch(n+m,d)]}
  const n=1+rnd(d-1),m=rnd(n-1);return[`${n}/${d} − ${m}/${d} = ?`,...fch(n-m,d)];
}

// ---------- drawing (board is 11 wide x 2.2 tall units) ----------
const X=x=>x*S,Y=y=>(2.2-y)*S;
function draw(){
  c.fillStyle='#000';c.fillRect(0,0,660,132);
  c.lineWidth=2;c.textAlign='center';c.textBaseline='middle';c.font='bold 30px "Courier New",monospace';
  for(let k=0;k<4;k++){const s=cells[k];if(!s)continue;
    c.fillStyle=s.f;c.strokeStyle=G;
    c.fillRect(X(CX[k]-.9),Y(2.1),1.8*S,S);c.strokeRect(X(CX[k]-.9),Y(2.1),1.8*S,S);
    if(!s.eaten){c.fillStyle=s.c;c.font=(String(ch[k]).length>5?'bold 22px':'bold 30px')+' "Courier New",monospace';c.fillText(ch[k],X(CX[k]),Y(1.6))}}
  if(trog){
    c.fillStyle='#d933cc';c.beginPath();
    TX.forEach((dx,i)=>{const px=X(trog.x+dx),py=Y(trog.y+TY[i]);i?c.lineTo(px,py):c.moveTo(px,py)});c.fill();
    [-.15,.15].forEach(dx=>{
      c.fillStyle='#fff';c.beginPath();c.arc(X(trog.x+dx),Y(trog.y+.2),6,0,7);c.fill();
      c.fillStyle='#000';c.beginPath();c.arc(X(trog.x+dx),Y(trog.y+.2),2.5,0,7);c.fill()})}
  c.fillStyle=mcol;c.beginPath();c.moveTo(X(mx),Y(my));
  c.arc(X(mx),Y(my),R*S,-face+mouth,-face+2*Math.PI-mouth);c.closePath();c.fill();
  const sd=.27*(Math.cos(face)<-.1?-1:1);
  c.fillStyle='#000';c.beginPath();
  c.arc(X(mx+.05*Math.cos(face)-sd*Math.sin(face)),Y(my+.05*Math.sin(face)+sd*Math.cos(face)),3,0,7);c.fill();
}

// ---------- animation (gen changes when the player leaves; animations then stop) ----------
const nf=async g=>{await new Promise(r=>requestAnimationFrame(r));if(g!==gen)throw 0};
const sl=async(ms,g)=>{await new Promise(r=>setTimeout(r,ms));if(g!==gen)throw 0};
async function mv(tx,ty){
  const g=gen,dx=tx-mx,dy=ty-my,d=Math.hypot(dx,dy);if(d<1e-6)return;
  face=Math.atan2(dy,dx);const n=Math.max(2,Math.ceil(d/.16)),x0=mx,y0=my;
  for(let s=1;s<=n;s++){mx=x0+dx*s/n;my=y0+dy*s/n;ph+=.9;mouth=.05+.6*Math.abs(Math.sin(ph));draw();await nf(g)}
}
async function chomp(n){
  const g=gen;
  for(let i=0;i<n;i++){snd.chomp();for(let p=0;p<=7;p++){mouth=.05+.65*Math.sin(p*Math.PI/7);draw();await nf(g);await nf(g)}}
  mouth=.3;draw();
}
async function eat(k){
  await mv(CX[k],LY);await mv(CX[k],HY);await chomp(2);
  cells[k].eaten=1;snd.yum();cells[k].f='#0f4d0f';await chomp(1);cells[k].f='#000';
  await mv(CX[k],LY);
}
async function wrong(k){
  const g=gen;
  await mv(CX[k],LY);await mv(CX[k],HY);await chomp(1);
  cells[k].f='#730000';cells[k].c='#ff6666';await mv(CX[k],LY);
  const stop=Math.min(mx+1.3,10.2);trog={x:11.8,y:LY};snd.growl();
  while(trog.x>stop){trog.x=Math.max(stop,trog.x-.2);trog.y=LY+.05*Math.sin(8*trog.x);draw();await nf(g)}
  mcol='#ff5a33';face=0;const x0=mx;snd.oops();
  for(let i=1;i<=14;i++){mx=x0+.08*(i%2?-1:1);mouth=.05+.5*(i%2);trog.y=LY+.08*(i%2);draw();await sl(30,g)}
  mx=x0;mouth=.3;
  while(trog.x<11.8){trog.x+=.3;trog.y=LY+.05*Math.sin(8*trog.x);draw();await nf(g)}
  trog=null;mcol=G;draw();
}

// ---------- game flow ----------
async function next(){
  const g=gen;
  if(++q>NQ)return finish();
  tries=0;locked=true;
  const [t,a,cs]=mk();ans=a;ch=cs;
  $('prog').textContent=`Question ${q} of ${NQ}`;
  $('sc').textContent=`Score: ${pts}`;
  $('q').textContent=t;
  $('fb').textContent='Pick the right answer!'+(t.includes('/')?' Simplest form!':'');$('fb').className='';
  [...$('opts').children].forEach((b,k)=>{b.textContent=ch[k];b.className='opt';b.disabled=false});
  cells=ch.map(()=>({f:'#000',c:G,eaten:0}));
  mx=-.6;my=LY;face=0;mouth=.3;mcol=G;trog=null;draw();
  await mv(HX,LY);
  if(g===gen){locked=false;t0=performance.now()}   // the clock only runs while the child is thinking
}
async function pick(k){
  if(locked)return;locked=true;
  const g=gen,b=$('opts').children[k],fb=$('fb'),el=performance.now()-t0;think+=el;
  try{
    if(ch[k]===ans){
      let p=50;                                   // 2nd try = 50; 1st try = 100 + up to 50 speed bonus
      if(!tries){p=100+Math.max(0,Math.round(50*(1-el/1e4)));fb.textContent=PR[Math.random()*PR.length|0]}
      else fb.textContent='You got it! Good job trying again!';
      pts+=p;fb.className='ok';$('sc').textContent=`Score: ${pts}`;b.className='opt good';
      burst(b,p);
      await eat(k);await sl(400,g);await next();
    }else{
      tries++;b.className='opt bad';b.disabled=true;fb.textContent='Oops! A Troggle!';fb.className='no';
      await wrong(k);
      if(tries>=MAXT){
        const gd=ch.indexOf(ans);$('opts').children[gd].className='opt good';
        fb.textContent=`The answer is ${ans}. Remember it!`;
        await eat(gd);await sl(400,g);await next();
      }else{fb.textContent='Not quite. Try again!';locked=false;t0=performance.now()}
    }
  }catch(e){if(e!==0)throw e}
}
function finish(){
  show('end');
  const n=Math.max(0,Math.min(5,Math.round(pts/NQ/30)));
  $('done').textContent=`ALL DONE, ${name.toUpperCase()}!`;
  $('res').textContent=`🎯 Score: ${pts} points`;
  $('tm').textContent=`Thinking time: ${Math.round(think/1000)} seconds`;
  $('stars').textContent='★'.repeat(n)+'☆'.repeat(5-n);
  $('msg').textContent=(save(name,pts)?'🏆 New personal best! ':'')+(n==5?'PERFECT! You are a math superstar!':n>=4?'Amazing work, champion!':n>=2?'Nice job! Keep practicing!':'Good try! Practice makes you stronger!');
  board($('bd2'),name);snd.fin(n>=4);
  for(let i=0;i<4;i++)setTimeout(()=>burst($('stars'),n*30),i*250);
}
$('go').onclick=()=>{
  snd.click();name=$('name').value.trim()||'Friend';mode=+$('mode').value;tbl=+$('tbl').value;
  gen++;q=0;pts=0;think=0;show('game');next().catch(e=>{if(e!==0)throw e});
};
$('menu').onclick=()=>{gen++;show('start')};
$('again').onclick=()=>show('start');
addEventListener('keydown',e=>{if(!$('game').hidden&&/^[1-4]$/.test(e.key))pick(+e.key-1)});
board($('bd'));
</script>
