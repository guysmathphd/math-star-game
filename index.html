<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Star Game</title>
<style>
:root{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
--bg:#eef6ff;--fg:#14213d;--card:#fff;--btn:#cde6ff;--good:#9be39b;--bad:#ffb3b3;--accent:#2a7de1;--ok:#1b7a2e;--no:#c0392b;--star:#e0a800}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1a2b;--fg:#e8f0ff;--card:#18263d;--btn:#24406b;--good:#2f7d3a;--bad:#8b2f3a;--accent:#5aa2ff;--ok:#6fe08a;--no:#ff8a80;--star:#ffd54a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1a2b;--fg:#e8f0ff;--card:#18263d;--btn:#24406b;--good:#2f7d3a;--bad:#8b2f3a;--accent:#5aa2ff;--ok:#6fe08a;--no:#ff8a80;--star:#ffd54a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:600px;margin:0 auto;padding:16px}
[hidden]{display:none!important}
h1{text-align:center;font-size:2.2rem;margin:.6em 0 .2em}
.c{text-align:center}
label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:1.2rem;margin:14px 0}
input,select{font:inherit;padding:8px;width:58%;border-radius:10px;border:2px solid var(--accent);background:var(--card);color:var(--fg)}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;color:var(--fg)}
.big{display:block;margin:28px auto;padding:16px 40px;font-size:1.8rem;font-weight:700;background:var(--good)}
.top{display:flex;justify-content:space-between;font-size:1.1rem}
#q{font-size:clamp(2.4rem,11vw,4rem);font-weight:800;text-align:center;margin:8px 0}
canvas{width:100%;height:auto;display:block;border-radius:10px;border:3px solid #33ff33;background:#000}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.opt{min-height:72px;font-size:2.2rem;font-weight:700;background:var(--btn)}
.opt.good{background:var(--good)}.opt.bad{background:var(--bad)}
.opt:disabled{opacity:.75;cursor:default}
#fb{min-height:2em;text-align:center;font-size:1.4rem;font-weight:700}
.ok{color:var(--ok)}.no{color:var(--no)}
.small{padding:6px 16px;background:var(--btn)}
#stars{text-align:center;font-size:3rem;color:var(--star)}
</style>
</head>
<body>
<main>
<div style="text-align:right"><button class="small" id="mute">🔊 Sound on</button></div>
<section id="start">
  <h1>⭐ Math Star Game ⭐</h1>
  <p class="c">Practice your addition and subtraction!</p>
  <label>Your name <input id="name" maxlength="20" autocomplete="off"></label>
  <label>Practice <select id="mode"><option value="1">Addition (+)</option><option value="2">Subtraction (−)</option><option value="3">Both</option></select></label>
  <label>Number table <select id="tbl"></select></label>
  <button class="big" id="go">START!</button>
</section>

<section id="game" hidden>
  <div class="top"><span id="prog"></span><span id="sc"></span></div>
  <div id="q"></div>
  <canvas id="cv" width="660" height="132" aria-label="Arcade board where the Muncher eats the answer"></canvas>
  <div id="opts"></div>
  <div id="fb"></div>
  <button class="small" id="menu">Menu</button>
</section>

<section id="end" hidden>
  <h1 id="done"></h1>
  <p class="c" id="res" style="font-size:1.4rem"></p>
  <div id="stars"></div>
  <p class="c" id="msg" style="font-size:1.3rem"></p>
  <button class="big" id="again">Play Again</button>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const S=60,G='#33ff33',NQ=10,MAXT=2;
const TX=[-.49,-.49,-.28,.28,.49,.49,.245,0,-.245],TY=[-.49,.35,.56,.56,.35,-.49,-.28,-.49,-.28];
const CX=[2.75,4.75,6.75,8.75],HX=.8,LY=.5,HY=1.45,R=.5;
const PR=['Great job!','Awesome!','You got it!','Super!','Fantastic!','Way to go!','Brilliant!'];
const cv=$('cv'),c=cv.getContext('2d');
let gen=0,mode=1,tbl=0,name='Friend',q=0,score=0,tries=0,ans=0,ch=[0,0,0,0],locked=true;
let mx=-.6,my=LY,face=0,mouth=.3,ph=0,mcol=G,trog=null,cells=[];

// ---------- sound (synthesized with Web Audio, no files needed) ----------
let AC=null,mute=false;
try{mute=localStorage.getItem('msg-mute')==='1'}catch(e){}
function tone(f,d,type='square',v=.1,at=0,f2){
  if(mute)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),gn=AC.createGain(),t0=AC.currentTime+at;
    o.type=type;o.frequency.setValueAtTime(f,t0);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
    gn.gain.setValueAtTime(v,t0);gn.gain.exponentialRampToValueAtTime(.001,t0+d);
    o.connect(gn);gn.connect(AC.destination);o.start(t0);o.stop(t0+d+.02);
  }catch(e){}
}
const snd={
  click:()=>tone(660,.06),
  chomp:()=>{tone(520,.07,'square',.1,0,260);tone(260,.07,'square',.1,.09,520)},
  yum:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.14,'square',.1,i*.09)),
  growl:()=>tone(120,.4,'sawtooth',.12,0,70),
  oops:()=>{tone(330,.18,'sawtooth',.12,0,200);tone(250,.18,'sawtooth',.12,.2,150);tone(180,.3,'sawtooth',.12,.4,90)},
  fin:good=>(good?[523,659,784,1047,784,1047]:[392,440,494,523]).forEach((f,i)=>tone(f,.2,'square',.1,i*.15))
};
const setMute=()=>{$('mute').textContent=mute?'🔇 Sound off':'🔊 Sound on'};
$('mute').onclick=()=>{mute=!mute;try{localStorage.setItem('msg-mute',mute?'1':'0')}catch(e){}setMute();snd.click()};
setMute();

// ---------- setup ----------
$('tbl').innerHTML='<option value="0">All numbers</option>'+Array.from({length:12},(_,i)=>`<option>${i+1}</option>`).join('');
for(let k=0;k<4;k++){const b=document.createElement('button');b.className='opt';b.onclick=()=>pick(k);$('opts').appendChild(b)}
const show=id=>['start','game','end'].forEach(s=>$(s).hidden=s!==id);
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=n=>1+Math.random()*n|0;
const choices=a=>sh([a,...sh([-3,-2,-1,1,2,3,10,-10].map(d=>a+d).filter(v=>v>=0)).slice(0,3)]);

// ---------- drawing (x,y in board units: 11 wide, 2.2 tall) ----------
const X=x=>x*S,Y=y=>(2.2-y)*S;
function draw(){
  c.fillStyle='#000';c.fillRect(0,0,660,132);
  c.lineWidth=2;c.textAlign='center';c.textBaseline='middle';c.font='bold 30px "Courier New",monospace';
  for(let k=0;k<4;k++){const s=cells[k];if(!s)continue;
    c.fillStyle=s.f;c.strokeStyle=G;
    c.fillRect(X(CX[k]-.9),Y(2.1),1.8*S,S);c.strokeRect(X(CX[k]-.9),Y(2.1),1.8*S,S);
    if(!s.eaten){c.fillStyle=s.c;c.fillText(ch[k],X(CX[k]),Y(1.6))}}
  if(trog){
    c.fillStyle='#d933cc';c.beginPath();
    TX.forEach((dx,i)=>{const px=X(trog.x+dx),py=Y(trog.y+TY[i]);i?c.lineTo(px,py):c.moveTo(px,py)});c.fill();
    [-.15,.15].forEach(dx=>{
      c.fillStyle='#fff';c.beginPath();c.arc(X(trog.x+dx),Y(trog.y+.2),6,0,7);c.fill();
      c.fillStyle='#000';c.beginPath();c.arc(X(trog.x+dx),Y(trog.y+.2),2.5,0,7);c.fill()})}
  c.fillStyle=mcol;c.beginPath();c.moveTo(X(mx),Y(my));
  c.arc(X(mx),Y(my),R*S,-face+mouth,-face+2*Math.PI-mouth);c.closePath();c.fill();
  const sd=.27*(Math.cos(face)<-.1?-1:1);
  c.fillStyle='#000';c.beginPath();
  c.arc(X(mx+.05*Math.cos(face)-sd*Math.sin(face)),Y(my+.05*Math.sin(face)+sd*Math.cos(face)),3,0,7);c.fill();
}

// ---------- animation (gen changes when the player leaves; animations then stop) ----------
const nf=async g=>{await new Promise(r=>requestAnimationFrame(r));if(g!==gen)throw 0};
const sl=async(ms,g)=>{await new Promise(r=>setTimeout(r,ms));if(g!==gen)throw 0};

async function mv(tx,ty){            // walk in a straight line, chomping
  const g=gen,dx=tx-mx,dy=ty-my,d=Math.hypot(dx,dy);if(d<1e-6)return;
  face=Math.atan2(dy,dx);const n=Math.max(2,Math.ceil(d/.16)),x0=mx,y0=my;
  for(let s=1;s<=n;s++){mx=x0+dx*s/n;my=y0+dy*s/n;ph+=.9;mouth=.05+.6*Math.abs(Math.sin(ph));draw();await nf(g)}
}
async function chomp(n){             // open and close the mouth in place
  const g=gen;
  for(let i=0;i<n;i++){snd.chomp();for(let p=0;p<=7;p++){mouth=.05+.65*Math.sin(p*Math.PI/7);draw();await nf(g);await nf(g)}}
  mouth=.3;draw();
}
async function eat(k){               // hop up under cell k and munch the number
  await mv(CX[k],LY);await mv(CX[k],HY);await chomp(2);
  cells[k].eaten=1;snd.yum();cells[k].f='#0f4d0f';await chomp(1);cells[k].f='#000';
  await mv(CX[k],LY);
}
async function wrong(k){             // bite the wrong number; a Troggle sneaks in
  const g=gen;
  await mv(CX[k],LY);await mv(CX[k],HY);await chomp(1);
  cells[k].f='#730000';cells[k].c='#ff6666';await mv(CX[k],LY);
  const stop=Math.min(mx+1.3,10.2);trog={x:11.8,y:LY};snd.growl();
  while(trog.x>stop){trog.x=Math.max(stop,trog.x-.2);trog.y=LY+.05*Math.sin(8*trog.x);draw();await nf(g)}
  mcol='#ff5a33';face=0;const x0=mx;snd.oops();
  for(let i=1;i<=14;i++){mx=x0+.08*(i%2?-1:1);mouth=.05+.5*(i%2);trog.y=LY+.08*(i%2);draw();await sl(30,g)}
  mx=x0;mouth=.3;
  while(trog.x<11.8){trog.x+=.3;trog.y=LY+.05*Math.sin(8*trog.x);draw();await nf(g)}
  trog=null;mcol=G;draw();
}

// ---------- game flow ----------
async function next(){
  const g=gen;
  if(++q>NQ)return finish();
  tries=0;locked=true;
  const x=tbl||rnd(12),y=rnd(12),op=mode==3?rnd(2):mode;let a,b,s;
  if(op==1){a=x;b=y;if(Math.random()<.5)[a,b]=[b,a];ans=a+b;s='+'}
  else{a=x+y;b=x;ans=y;s='−'}               // (x+y) − x = y, never negative
  ch=choices(ans);
  $('prog').textContent=`Question ${q} of ${NQ}`;
  $('sc').textContent=`Stars: ${score}`;
  $('q').textContent=`${a} ${s} ${b} = ?`;
  $('fb').textContent='Pick the right answer!';$('fb').className='';
  [...$('opts').children].forEach((b,k)=>{b.textContent=ch[k];b.className='opt';b.disabled=false});
  cells=ch.map(()=>({f:'#000',c:G,eaten:0}));
  mx=-.6;my=LY;face=0;mouth=.3;mcol=G;trog=null;draw();
  await mv(HX,LY);                          // the Muncher walks in
  if(g===gen)locked=false;
}
async function pick(k){
  if(locked)return;locked=true;
  const g=gen,b=$('opts').children[k],fb=$('fb');
  try{
    if(ch[k]===ans){
      if(!tries){score++;fb.textContent=PR[Math.random()*PR.length|0]}else fb.textContent='You got it! Good job trying again!';
      fb.className='ok';$('sc').textContent=`Stars: ${score}`;b.className='opt good';
      await eat(k);await sl(400,g);await next();
    }else{
      tries++;b.className='opt bad';b.disabled=true;fb.textContent='Oops! A Troggle!';fb.className='no';
      await wrong(k);
      if(tries>=MAXT){
        const gd=ch.indexOf(ans);$('opts').children[gd].className='opt good';
        fb.textContent=`The answer is ${ans}. Remember it!`;
        await eat(gd);await sl(400,g);await next();
      }else{fb.textContent='Not quite. Try again!';locked=false}
    }
  }catch(e){if(e!==0)throw e}
}
function finish(){
  show('end');
  snd.fin(score>=8);const n=Math.round(score/NQ*5);
  $('done').textContent=`ALL DONE, ${name.toUpperCase()}!`;
  $('res').textContent=`You got ${score} out of ${NQ} on the first try.`;
  $('stars').textContent='★'.repeat(n)+'☆'.repeat(5-n);
  $('msg').textContent=score==NQ?'PERFECT! You are a math superstar!':score>=8?'Amazing work! You are a math champion!':score>=5?'Nice job! Keep practicing!':'Good try! Practice makes you stronger!';
}
$('go').onclick=()=>{
  snd.click();name=$('name').value.trim()||'Friend';mode=+$('mode').value;tbl=+$('tbl').value;
  gen++;q=0;score=0;show('game');next().catch(e=>{if(e!==0)throw e});
};
$('menu').onclick=()=>{gen++;show('start')};
$('again').onclick=()=>show('start');
addEventListener('keydown',e=>{if(!$('game').hidden&&/^[1-4]$/.test(e.key))pick(+e.key-1)});
</script>
</body>
</html>
